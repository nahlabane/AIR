<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AIR Assessment</title>

    <link rel="stylesheet" href="css/style.css">


    <style>

        .assessment-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
        }


        .assessment-code {
            background: #eef4fb;
            border-left: 5px solid #124a87;
            padding: 12px;
            margin-bottom: 25px;
        }


        .question-heading {
            margin-top: 35px;
            margin-bottom: 20px;
            color: #124a87;
            border-bottom: 2px solid #124a87;
            padding-bottom: 8px;
        }


        .question {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }


        .question-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }


        .option {
            display: block;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            background: #fafafa;
        }


        .option:hover {
            background: #eef4fb;
        }


        .option input {
            margin-right: 10px;
        }


        #submitAssessment {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }


        .error-message {
            color: #b00020;
            background: #ffeaea;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }


        .loading {
            padding: 20px;
            text-align: center;
        }


        .attempt-info {
            background: #eef4fb;
            border-left: 5px solid #124a87;
            padding: 12px;
            margin-bottom: 20px;
        }


        .closed-message {
            color: #b00020;
            background: #ffeaea;
            border-left: 5px solid #b00020;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }


        /* =========================================
           ASSESSMENT PAGE LAYOUT FIX
           ========================================= */

        html,
        body {

            width: 100%;
            min-height: 100%;
            height: auto !important;

            margin: 0;
            padding: 0;

            display: block !important;

            justify-content: initial !important;
            align-items: initial !important;

            overflow-x: hidden !important;
            overflow-y: auto !important;
        }


        /* Assessment header */

        body > header {

            width: 100%;
            display: block;
        }


        /* Main assessment content */

        main {

            width: 100%;
            display: block;

            height: auto !important;
            min-height: 0 !important;

            overflow: visible !important;
        }


        /* Assessment container */

        .assessment-container {

            width: 100%;
            max-width: 900px;

            height: auto !important;
            max-height: none !important;

            margin: 30px auto;

            overflow: visible !important;
        }

    </style>

</head>


<body>


<header>

    <h1>African Industrial Revolution (AIR)</h1>

    <p>Assessment Submission</p>

</header>


<main>

    <div class="assessment-container">


        <h2>Final Answers</h2>


        <p>
            Select the correct answer for each question
            using your question paper.
        </p>


        <!-- Assessment Information -->

        <div id="assessmentInfo">

            Loading assessment...
    <div id="countdownTimer" class="countdown-timer"></div>
        </div>


        <!-- Questions -->

        <div id="questions">

            <div class="loading">

                Loading questions...

            </div>

        </div>


        <!-- Submit -->

        <button
            id="submitAssessment"
            type="button"
            onclick="submitAssessment()"
            disabled>

            Submit Final Answers

        </button>


    </div>

</main>


 


</body>

</html>
