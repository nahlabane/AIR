<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AIR Video Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f7fa;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            margin-top: 25px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            AIR Video Test
        </h1>

        <p>
            Standalone YouTube embedding test.
        </p>

        <div class="video-container">
<iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/RS1zgTi1HOc?origin=https://nahlabane.github.io"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="origin"
    allowfullscreen>
</iframe>

        </div>

    </div>

</body>

</html>
